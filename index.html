<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada · Macarenco</title>
    
    <!-- Favicon -->
    <link href="imagen/logo-apc.png" rel="icon">

    <!-- Google Fonts: Poppins para todo (más ligera y legible en móviles) -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet"> 

    <style>
        /* Variables de color basadas en Macarenco */
        :root {
            --azul-cielo: #039ed6;
            --azul-oscuro: #026892;
            --azul-fuerte: #0044cc; 
            --blanco: #ffffff;
            --gris-oscuro: #1a2630;
        }

        body {
            margin: 0;
            padding: 20px; /* Margen de seguridad para móviles */
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--azul-oscuro), var(--azul-fuerte));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gris-oscuro);
            box-sizing: border-box;
        }

        .error-card {
            background-color: var(--blanco);
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            max-width: 500px;
            width: 100%; /* Se adapta al ancho del móvil */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            /* Borde degradado */
            border: 3px solid transparent;
            background: linear-gradient(var(--blanco), var(--blanco)) padding-box,
                        linear-gradient(135deg, var(--azul-cielo), var(--azul-fuerte)) border-box;
        }

        /* LOGO: Ajustado para que no sea gigante en celulares */
        .error-logo {
            width: 80%; /* Ocupa el 80% del ancho de la tarjeta */
            max-width: 250px; /* Pero nunca más de 250px */
            height: auto;
            margin-bottom: 20px;
            object-fit: contain;
        }

        /* TÍTULO 404 CON FUENTE NORMAL Y LEGIBLE */
        .error-code {
            font-family: 'Poppins', sans-serif;
            font-size: 5rem;
            font-weight: 800;
            color: var(--azul-fuerte);
            margin: 0;
            line-height: 1;
        }

        .error-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--gris-oscuro);
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .error-desc {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* BOTÓN GRANDE PARA TOCAR EN MÓVILES */
        .btn-home {
            display: block; /* Ocupa todo el ancho en móviles */
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--blanco);
            text-decoration: none;
            border-radius: 8px;
            border: 2px solid transparent;
            background: linear-gradient(135deg, var(--azul-cielo), var(--azul-fuerte)) padding-box,
                        linear-gradient(135deg, var(--azul-fuerte), var(--azul-cielo)) border-box;
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 68, 204, 0.4);
        }

        .credits {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #888;
        }
        .credits strong {
            color: var(--azul-oscuro);
        }

        /* Ajustes extra para pantallas muy pequeñas */
        @media (max-width: 400px) {
            .error-code { font-size: 4rem; }
            .error-title { font-size: 1.2rem; }
            .error-card { padding: 30px 15px; }
        }
    </style>
</head>
<body>

    <div class="error-card">
        <!-- Tu Logo -->
        <img src="https://sosasoftcuba.github.io/revista_macarencos/imagen/logo_sosasoftcuba.png" alt="SosaSoftCuba" class="error-logo">
        
        <!-- Código de error con fuente estándar -->
        <h1 class="error-code">404</h1>
        
        <!-- Mensaje -->
        <h2 class="error-title">Página no encontrada</h2>
        <p class="error-desc">
            La página que buscas no existe o ha sido movida. Regresa a la portada para seguir leyendo.
        </p>
        
        <!-- Botón grande para dedos en móviles (usando flecha unicode en lugar de FontAwesome) -->
        <a href="https://sosasoftcuba.github.io/revista_macarencos/" class="btn-home">
            ← Volver al Inicio
        </a>

        <div class="credits">
            <strong>SosaSoftCuba</strong> / Asociación de Pedagogos de Cuba / 2026
        </div>
    </div>

</body>
</html>
